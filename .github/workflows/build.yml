name: Build Horizon Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264'

      - name: Set NDK env
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Generate default app icons
        run: |
          python3 -c 'import zlib, struct; w=h=512; raw=b"".join(b"\x00"+b"\x4a\xde\x80\xff"*w for _ in range(h)); ihdr=struct.pack(">IIBBBBB",w,h,8,6,0,0,0); png=b"\x89PNG\r\n\x1a\n"+struct.pack(">I",13)+b"IHDR"+ihdr+struct.pack(">I",zlib.crc32(b"IHDR"+ihdr)&0xffffffff)+struct.pack(">I",len(zlib.compress(raw)))+b"IDAT"+zlib.compress(raw)+struct.pack(">I",zlib.crc32(b"IDAT"+zlib.compress(raw))&0xffffffff)+b"\x00\x00\x00\x00IEND\xaeB`\x82"; open("icon.png","wb").write(png)'
          cargo tauri icon icon.png

      - name: Initialize Android project & Build APK
        run: |
          cargo tauri android init
          python3 -c 'p="src-tauri/gen/android/app/src/main/AndroidManifest.xml"; s=open(p).read().replace("<application", "<queries><package android:name=\"com.mojang.minecraftpe\" /></queries>\n    <application"); open(p,"w").write(s)'
          cargo tauri android build --apk --target aarch64

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias horizon -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Horizon,O=Launcher,C=RU"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:123456 --out HorizonLauncher-signed.apk src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-launcher-signed
          path: HorizonLauncher-signed.apk
